name: Build and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the legacy Pages build before publishing compiled assets
        uses: actions/github-script@v7
        with:
          script: |
            // Branch-based Pages can run alongside this workflow. Publish last.
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' && run.id !== context.runId);
              if (legacy.length && legacy.every(run => run.status === 'completed')) break;
              if (!legacy.length && attempt >= 3) break;
              if (attempt === 59) throw new Error('Legacy Pages build has not finished; refusing a deployment race');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
      - uses: actions/deploy-pages@v4
        id: deployment
